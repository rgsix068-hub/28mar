<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sayang! ❤️</title>
    <style>
        body {
            background-color: #ffebee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 10;
            max-width: 90%;
            position: relative;
        }

        h1 { color: #d81b60; margin-bottom: 10px; font-weight: bold; }
        p.sub-text { color: #555; margin-bottom: 20px; }

        /* Tombol Hati Inti */
        #core-heart-btn {
            background: none; border: none; cursor: pointer;
            transition: 0.3s; padding: 0; margin: 20px 0;
        }
        #core-heart-btn:hover { transform: scale(1.1); }

        /* Bingkai Polaroid */
        #photo-container {
            display: none; margin: 20px auto;
            border: 15px solid #fff; padding: 10px 10px 50px 10px;
            background-color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-width: 300px; border-radius: 5px;
        }
        #photo-frame-caption {
            font-family: 'Brush Script MT', cursive; font-size: 1.5rem;
            margin-top: 15px; color: #333;
        }

        /* Tombol Umum */
        .btn {
            background: #ff4081; color: white; border: none;
            padding: 15px 30px; border-radius: 50px;
            font-size: 18px; cursor: pointer; margin: 10px;
        }

        #no-btn { position: absolute; transition: 0.2s; }

        /* Confetti */
        .heart-confetti {
            position: fixed; color: #ff4081; font-size: 20px;
            animation: confettiFall 2s ease-out forwards;
            pointer-events: none; z-index: 100;
        }
        @keyframes confettiFall {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--x), 100vh) scale(var(--s)) rotate(var(--r)); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="main-title">Happy Birthday Sayang! 🎂</h1>
        <p class="sub-text">Klik kado di bawah ini untuk melihat kejutan dari aku...</p>
        
        <div id="core-heart-area">
            <button id="core-heart-btn" onclick="openGift()">
                <svg width="200px" height="200px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16.816 3C15.82 3 14.864 3.39327 14.16 4.09117L12 6.23348L9.84 4.09117C9.136 3.39327 8.18 3 7.184 3C4.872 3 3 4.8568 3 7.1492C3 9.44161 5.3 12.0621 12 18.0031C18.7 12.0621 21 9.44161 21 7.1492C21 4.8568 19.128 3 16.816 3Z" fill="red" stroke="black" stroke-width="2"/>
                    <path d="M12 18.0031C5.3 12.0621 3 9.44161 3 7.1492M12 18.0031C18.7 12.0621 21 9.44161 21 7.1492" stroke="black" stroke-width="2"/>
                </svg>
            </button>
        </div>

        <div id="message-area" style="display:none;">
            <div id="photo-container">
                <img src="https://placehold.co/600x400/FFC0CB/FFFFFF?text=FOTO+KITA" alt="Foto Berdua" style="width: 100%;">
                <div id="photo-frame-caption">Bersamamu Selamanya ❤️</div>
            </div>
            
            <p id="wish-text" style="font-weight: bold; font-size: 1.2rem;"></p>
            <hr>
            <h3>Pertanyaan Penting:</h3>
            <p>Sayang aku nggak hari ini?</p>
            <button class="btn" onclick="sayYes()">Sayang Banget!</button>
            <button class="btn" id="no-btn" onmouseover="moveButton()">Nggak</button>
        </div>
    </div>

    <script>
        function openGift() {
            document.getElementById('core-heart-area').style.display = 'none';
            document.querySelector('.sub-text').style.display = 'none';
            
            // Berubah judul setelah klik
            document.getElementById('main-title').innerText = "You're My Everything! ✨";
            
            document.getElementById('message-area').style.display = 'block';
            document.getElementById('photo-container').style.display = 'block';
            document.getElementById('wish-text').innerText = "Selamat ulang tahun ya! Semoga di umur yang baru ini kamu makin bahagia dan tetap jadi orang paling sabar buat aku. Love You! 🌸";

            triggerConfetti();
        }

        function triggerConfetti() {
            for (let i = 0; i < 60; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart-confetti');
                heart.innerHTML = '❤️';
                const angle = Math.random() * Math.PI * 2;
                const distance = 100 + Math.random() * 200;
                heart.style.setProperty('--x', Math.cos(angle) * distance + 'px');
                heart.style.left = '50%';
                heart.style.top = '50%';
                heart.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
                heart.style.setProperty('--s', (Math.random() * 0.5 + 0.8));
                heart.style.setProperty('--r', (Math.random() * 360) + 'deg');
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 2000);
            }
        }

        function moveButton() {
            const btn = document.getElementById('no-btn');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function sayYes() {
            alert("Aww! Aku juga sayang banget sama kamu! 🥰");
        }
    </script>
</body>
</html>
